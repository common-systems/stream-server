services:
  nginx-rtmp:
    build: ./nginx
    ports:
      - "1935:1935"
      - "8080:80"
    volumes:
      - hls:/opt/data/hls

  fastapi:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install -r requirements.txt -q &&
             uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  hls: